name: build-jar

# Builds the relay jar on a runner and publishes it, so the jar can be produced
# without a JDK on the operator's machine.
#
# The jar is VERIFIED before it is published: it is booted here and /health is
# fetched, so an artifact that cannot start never reaches the panel.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the jar as a release asset as well as an artifact'
        required: false
        default: 'true'
      credentials:
        description: 'The contents of baked-credentials.json, as JSON. Never committed.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Write the baked credentials
        env:
          CREDENTIALS: ${{ inputs.credentials }}
        run: |
          set -uo pipefail
          if [ -z "${CREDENTIALS:-}" ]; then echo '::error::no credentials supplied'; exit 1; fi
          printf '%s' "$CREDENTIALS" > baked-credentials.json
          chmod 600 baked-credentials.json
          python3 -c "import json;json.load(open('baked-credentials.json'));print('credentials parse OK')" || { echo '::error::credentials are not valid JSON'; exit 1; }

      - name: Build server.jar
        run: |
          set -uo pipefail
          echo "node $(node --version)   java $(java -version 2>&1 | head -1)"
          export NODE_RUNTIME="$(dirname "$(dirname "$(command -v node)")")"
          bash scripts/pack-jar.sh
          ls -la server.jar

      - name: Verify the jar boots and serves
        run: |
          set -uo pipefail
          rm -rf /tmp/verify && mkdir -p /tmp/verify && cp server.jar /tmp/verify/
          cd /tmp/verify
          # PATH deliberately has no node: the container this jar runs in has none
          # either, so a jar that only works because of a PATH fallback must fail here.
          PATH=/usr/bin:/bin PORT=25999 HOST=127.0.0.1 RELAY_TOKEN=relay nohup java -jar server.jar > jar.log 2>&1 &
          echo $! > jar.pid
          ok=0
          for i in $(seq 1 45); do
            if curl -sf --max-time 3 http://127.0.0.1:25999/health > health.json; then ok=1; break; fi
            sleep 1
          done
          cat jar.log
          echo "--- /health ---"
          cat health.json 2>/dev/null || echo "(no health)"
          kill "$(cat jar.pid)" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "::error::the built jar did not answer /health"; exit 1; fi
          grep -q "using bundled node runtime" jar.log || { echo "::error::the jar did not use its BUNDLED node runtime"; exit 1; }
          echo "jar verified"

      # The PORT and HOST the relay listens on are BAKED, and the panel has no
      # start.properties entry for them. A build that omits them listens on the config
      # default (8791) instead of the port the daemon expects (25566), so every lane
      # registers against a dead port and dies instantly -- which is exactly what
      # happened on 2026-10-20. So boot the jar with NO port override and check it
      # listens on the port that was actually baked in.
      - name: Verify the baked port is the port it listens on
        run: |
          set -uo pipefail
          # Read the baked port BEFORE changing directory: baked-credentials.json lives in
          # the repository root, and the step below moves to /tmp/verify2.
          EXPECTED=$(python3 -c "import json;print(json.load(open('baked-credentials.json')).get('PORT',8791))")
          echo "baked port: $EXPECTED"
          rm -rf /tmp/verify2 && mkdir -p /tmp/verify2 && cp server.jar /tmp/verify2/
          cd /tmp/verify2
          PATH=/usr/bin:/bin nohup java -jar server.jar > jar.log 2>&1 &
          echo $! > jar.pid
          for i in $(seq 1 45); do
            if curl -sf --max-time 3 "http://127.0.0.1:$EXPECTED/health" > health.json; then break; fi
            sleep 1
          done
          cat jar.log
          grep -q "listening on http://0.0.0.0:$EXPECTED" jar.log || { echo "::error::the jar is NOT listening on the baked port $EXPECTED"; exit 1; }
          cat health.json 2>/dev/null || echo "(no health)"
          kill "$(cat jar.pid)" 2>/dev/null || true
          echo "baked port verified"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: server.jar
          path: server.jar
          if-no-files-found: error

      - name: Publish as a release asset
        if: ${{ inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" server.jar --title "server.jar $TAG" --notes "Automated build of the relay jar." --repo "${{ github.repository }}"
