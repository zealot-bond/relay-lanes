name: lane

# One GitHub Actions job == one lane == one egress IP == one upstream rate-limit
# bucket. This is the whole design: the free tier buckets quota per egress IP, so
# N concurrent runners give N independent buckets.
#
# Measured on this account:
#   run 37313287045  20 runners, 20 distinct Azure IPs, 100/100 served, 0 x 429
#   run 37318129878  20 runners, 1456 served, 0 x 429, ~460 req/min aggregate
# ...while the relay host's own egress was rate limited on every request.
#
# A free account allows 20 concurrent jobs, and queued runs start automatically
# as running ones finish, so the orchestrator only tops the queue up.
#
# A lane exits 75 the moment its bucket is exhausted. That frees its concurrency
# slot and the next dispatch supplies a runner with a fresh IP.

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: 'Relay base URL supplied by the orchestrator'
        required: false
        default: ''
      relay_token:
        description: 'Shared token for the relay lane endpoints'
        required: false
        default: ''
      lane_lifetime_s:
        description: 'Override the lane lifetime, for testing self-replenishment'
        required: false
        default: ''
  # No schedule. Lanes are supplied by the relay's orchestrator (relay.yml). A schedule here
  # would add runs that nothing dispatches to and that register with whatever RELAY_URL holds.

permissions:
  contents: read

concurrency:
  group: lane-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  lane:
    name: lane-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The relay-side sources live in this repo but run in the JAR, not here, so
      # nothing on a runner would ever notice if one of them stopped parsing. A
      # broken server.js is invisible until someone builds a jar from it. Check
      # them here, where the failure is cheap to see. Never fatal: a broken
      # relay-side file must not take the lane pool down with it.
      - name: Check that the relay-side sources parse
        run: |
          set -uo pipefail
          for f in src/server.js src/queue.js src/orchestrator.js src/main.js src/models.js src/config.js src/lane.js src/worker.js src/fingerprint.js src/toolmerge.js src/codeversion.js; do
            if node --check "$f" 2>/tmp/chk.err; then
              echo "parse OK   $f"
            else
              echo "parse FAIL $f"
              sed "s/^/    /" /tmp/chk.err
            fi
          done
      - name: Serve until the bucket is spent
        env:
          # Dispatch input wins; the repo secret is the fallback for the scheduled
          # runs, which have no orchestrator to supply a value.
          RELAY_URL: ${{ inputs.relay_url || secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ inputs.relay_token || secrets.RELAY_TOKEN }}
          LANE_ID: lane-${{ github.run_id }}-${{ github.run_attempt }}
          LANE_LIFETIME_S: ${{ inputs.lane_lifetime_s || '3300' }}
          LANE_IDLE_EXIT_S: '2400'
          # Split by phase: prefill on a large prompt is slow but healthy,
          # so allow a long wait for the first byte, then tighten once
          # tokens are flowing.
          FIRST_BYTE_TIMEOUT_MS: '600000'
          STREAM_IDLE_TIMEOUT_MS: '120000'
          NODE_OPTIONS: '--dns-result-order=ipv4first'
          # Which source supplied each value, for diagnosing the same-mask
          # ambiguity between a dispatch input and a repo secret.
          TOKEN_SOURCE: ${{ inputs.relay_token && 'input' || (secrets.RELAY_TOKEN && 'secret') || 'none' }}
        run: |
          set -uo pipefail
          # Never print the token. A hash prefix plus the length is enough to tell
          # "the dispatch input arrived" from "the repo secret fallback won",
          # which is otherwise invisible because GitHub masks both values.
          if [ -n "${RELAY_TOKEN:-}" ]; then
            echo "token len=${#RELAY_TOKEN} sha=$(printf '%s' "$RELAY_TOKEN" | sha256sum | cut -c1-12)"
          else
            echo "token EMPTY"
          fi
          echo "relay set=$([ -n "${RELAY_URL:-}" ] && echo yes || echo no) token_source=${TOKEN_SOURCE:-unknown}"
          if [ -z "${RELAY_URL:-}" ]; then
            echo "no relay URL (dispatch input and RELAY_URL secret both empty); exiting"
            exit 0
          fi
          echo "relay=$RELAY_URL lane=$LANE_ID"
          node --version
          node src/worker.js